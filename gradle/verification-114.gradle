// Explicit native probes stay separate from player code and ordinary launches.
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    clientIntegrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    integrationTestImplementation.extendsFrom implementation
    integrationTestRuntimeOnly.extendsFrom runtimeOnly
    clientIntegrationTestImplementation.extendsFrom implementation
    clientIntegrationTestRuntimeOnly.extendsFrom runtimeOnly
}
['integrationTest', 'clientIntegrationTest'].each { setName ->
    tasks.register('prepare' + setName.capitalize() + 'Mod', Sync) {
        dependsOn setName + 'Classes'
        from sourceSets[setName].output
        into layout.buildDirectory.dir('forge-run-mod-classes/' + setName)
    }
}
minecraft.runs {
    register('probeServer') {
        workingDir.set(layout.projectDirectory.dir(providers.gradleProperty('probeDirectory').orElse('run/verification/server-high').get()))
        mods { basegemsprobe { source sourceSets.integrationTest } }
        def mainPath = baseGemsBuild.developmentOutput.get().asFile.absolutePath
        def probePath = layout.buildDirectory.dir('forge-run-mod-classes/integrationTest').get().asFile.absolutePath
        environment 'MOD_CLASSES', "basegems%%${mainPath}${File.pathSeparator}basegems%%${mainPath}${File.pathSeparator}basegemsprobe%%${probePath}${File.pathSeparator}basegemsprobe%%${probePath}"
        args '--nogui'
        if (providers.gradleProperty('probeUpgrade').orElse('false').get().toBoolean()) args '--forceUpgrade'
    }
    register('probeClient') {
        workingDir.set(layout.projectDirectory.dir(providers.gradleProperty('probeDirectory').orElse('run/verification/client').get()))
        environment 'target', 'fmluserdevclient'
        mods { basegemsclientprobe { source sourceSets.clientIntegrationTest } }
        def mainPath = baseGemsBuild.developmentOutput.get().asFile.absolutePath
        def probePath = layout.buildDirectory.dir('forge-run-mod-classes/clientIntegrationTest').get().asFile.absolutePath
        environment 'MOD_CLASSES', "basegems%%${mainPath}${File.pathSeparator}basegems%%${mainPath}${File.pathSeparator}basegemsclientprobe%%${probePath}${File.pathSeparator}basegemsclientprobe%%${probePath}"
    }
}
tasks.withType(JavaExec).configureEach {
    if (name in ['runProbeServer', 'runProbeClient']) {
        dependsOn 'prepareDevelopmentMod', name == 'runProbeServer' ? 'prepareIntegrationTestMod' : 'prepareClientIntegrationTestMod'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
        systemProperty 'basegemsprobe.upgrade', providers.gradleProperty('probeUpgrade').orElse('false').get()
        doFirst {
            File directory = file(providers.gradleProperty('probeDirectory').orElse(name == 'runProbeServer'
                    ? 'run/verification/server-high' : 'run/verification/client').get()).canonicalFile
            if (!directory.toPath().startsWith(file('run/verification').canonicalFile.toPath())
                    && !directory.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath())) {
                throw new GradleException('Probe runs require a disposable directory under run/verification or build')
            }
            directory.mkdirs()
            new File(directory, 'mods').mkdirs()
            if (name == 'runProbeServer') {
                if (!new File(directory, 'eula.txt').exists()) new File(directory, 'eula.txt').text = 'eula=true\n'
                if (!new File(directory, 'server.properties').exists()) new File(directory, 'server.properties').text =
                        'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nview-distance=2\nmax-tick-time=0\nlevel-seed=16112026\n'
            }
        }
        doLast {
            File receipt = new File(workingDir, name == 'runProbeServer' ? 'server-probe.json' : 'client-probe.json')
            if (!receipt.isFile() || new groovy.json.JsonSlurper().parse(receipt).status != 'passed') {
                throw new GradleException("Native test failed: ${receipt}")
            }
        }
    }
}
tasks.named('check') { dependsOn 'integrationTestClasses', 'clientIntegrationTestClasses' }
tasks.register('verifyPortResources', Exec) {
    group = 'verification'
    dependsOn 'generateGemResources'
    commandLine 'node', '--test', 'tools/test_port_114.js'
}
tasks.named('check') { dependsOn 'verifyPortResources' }

def probeJar = tasks.register('packagedProbeDeobfJar', Jar) {
    dependsOn 'integrationTestClasses'
    from sourceSets.integrationTest.output
    archiveFileName = 'basegemsprobe-deobf.jar'
    destinationDirectory = layout.buildDirectory.dir('packaged-probes')
}
def packagedProbe = renamer.classes(probeJar) {
    map.from minecraft.dependency.toSrgFile
    output = layout.buildDirectory.file('packaged-probes/basegemsprobe.jar')
}
tasks.register('preparePackagedProbe') { dependsOn packagedProbe, 'assemble' }
