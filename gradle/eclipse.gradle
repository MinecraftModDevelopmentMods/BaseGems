import java.util.regex.Matcher
import java.util.regex.Pattern

eclipse {
    synchronizationTasks 'prepareEclipse'
}

tasks.named('genEclipseRuns') {
    doLast {
        def boundaries = [
            '--cache': ' --metadata', '--metadata': ' --to-srg',
            '--to-srg': ' --to-obf', '--to-obf': ' --'
        ]
        ['runClient.launch', 'runServer.launch'].each { name ->
            File launch = file(name)
            String xml = launch.getText('UTF-8')
            boundaries.each { option, next ->
                def match = Pattern.compile(Pattern.quote(option + ' ') + '(.+?)' + Pattern.quote(next))
                        .matcher(xml)
                if (!match.find()) throw new GradleException("Missing ${option} in ${name}")
                String argument = match.group(1)
                if (!argument.startsWith('&quot;')) {
                    xml = match.replaceFirst(Matcher.quoteReplacement(option + ' &quot;' + argument + '&quot;' + next))
                }
            }
            if (!xml.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                xml = xml.replace('</launchConfiguration>', '<booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/></launchConfiguration>')
            }
            launch.setText(xml, 'UTF-8')
        }
    }
}
