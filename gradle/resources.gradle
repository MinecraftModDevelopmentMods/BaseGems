def generated = layout.buildDirectory.dir('generated/basegems-resources')
def generator = tasks.register('generateGemResources', Exec) {
    def python = providers.gradleProperty('pythonExecutable')
            .orElse(org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'python' : 'python3')
    inputs.file 'gradle/generate-resources.py'
    inputs.file 'gradle/model-templates.json'
    inputs.dir 'src/main/resources/assets/basegems'
    outputs.dir generated
    commandLine python.get(), 'gradle/generate-resources.py', generated.get().asFile.absolutePath
}

// The original models and locale files are the inputs for the flattened pack.
sourceSets.main.resources {
    exclude 'assets/basegems/blockstates/**', 'assets/basegems/models/**', 'assets/basegems/advancements/**'
}
tasks.named('processResources', ProcessResources) {
    dependsOn generator
    from generated
}
tasks.named('sourcesJar', Jar) {
    dependsOn generator
    from generated
}
