import groovy.json.JsonSlurper
import java.security.MessageDigest

def pins = new JsonSlurper().parse(file('gradle/dependencies.json'))
def pin = pins.find { it.id == 'orespawn' }
configurations {
    oreSpawnRelease { canBeConsumed = false; transitive = false }
    compatibilityReleases { canBeConsumed = false; transitive = false }
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation renamer.dependency(pin.coordinate)
    oreSpawnRelease pin.coordinate
    pins.findAll { it.id != 'orespawn' }.each { compatibilityReleases it.coordinate }
}
tasks.register('verifyReleaseDependencies') {
    group = 'verification'
    doLast {
        def jar = configurations.oreSpawnRelease.singleFile
        def digest = MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
        if (!digest.equalsIgnoreCase(pin.sha256)) throw new GradleException("Wrong OreSpawn release: ${jar.name}")
        def artifacts = configurations.compatibilityReleases.resolvedConfiguration.resolvedArtifacts
        pins.findAll { it.id != 'orespawn' }.each { compatibility ->
            def coordinate = compatibility.coordinate.split(':')
            def archive = artifacts.find { it.moduleVersion.id.name == coordinate[1]
                    && it.moduleVersion.id.version == coordinate[2] }.file
            def hash = MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
            if (!hash.equalsIgnoreCase(compatibility.sha256)) {
                throw new GradleException("Wrong compatibility release: ${archive.name}")
            }
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyReleaseDependencies' }
tasks.named('check') { dependsOn 'verifyReleaseDependencies' }
