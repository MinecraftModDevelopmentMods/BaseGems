name: Base Gems 1.12 CI

on:
  push:
    branches:
      - master-1.12
      - 'feature/**'
  pull_request:
    branches:
      - master-1.12

permissions:
  contents: read

concurrency:
  group: basegems-1.12-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install Java 25 for Mavenizer
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'

      - name: Install Java 8 for Forge
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'

      - name: Stage checksum-verified dependencies
        run: python3 gradle/stage-legacy-dependencies.py .gradle/legacy-dependencies

      - name: Build, audit jars and generate Eclipse launches
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew check build verifyReleaseArtifacts writeReleaseChecksums prepareEclipse \
            -PreleaseBuild=true --no-daemon --stacktrace --max-workers=2 \
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
          sha256sum build/libs/*.jar

      - name: Stage the audited release bundle
        run: |
          mkdir -p build/release-bundle
          cp build/libs/*.jar build/release/SHA256SUMS CHANGELOG.txt build/release-bundle/
          (cd build/release-bundle && sha256sum --check SHA256SUMS)

      - name: Upload the audited release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BaseGems-1.12.2-${{ github.sha }}
          path: build/release-bundle/*
          if-no-files-found: error
          retention-days: 90
