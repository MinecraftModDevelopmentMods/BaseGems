# Project
# Version string only used in dev, however when making a tag on github it should be like major.minor.bug.mc+loader
# Example: 1.0.0. 1 21 01 2 notice the minecraft version hidden there at the end?
# and the 2 means it's for NeoForge while 1 is Forge and I suspect if we did Fabric mods 3 would be for that.
# (This also helps for bug reports as the version number gives us a clue as to what version of Minecraft the bug happened on)
mod_version = 4.0.0.121012
mod_name = Base Gems
mod_id = basegems
mod_archive_name = BaseGems
mod_description = Mine and trade 33 gems, then use them to make blocks, tools and equipment. OreSpawn places their deposits.
mod_group = zone.moddev.mc.basegems
mod_authors = Jasmine Iwanek, SkyBlade1978 and the MMD Team
mod_license = LGPL-2.1
curseforge_id = 1793939
update_url = https://raw.githubusercontent.com/MinecraftModDevelopmentMods/BaseGems/refs/heads/master-1.21.1-neo/update.json
issue_url = https://github.com/MinecraftModDevelopmentMods/BaseGems/issues

# Dependencies
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
neoforge_version = 21.1.265
neoforge_version_range = [21.1.265,)
loader_version_range = [3,)
mmdlib_version = 2.0.2.121012+Neo
mmdlib_version_range = [2.0.2,)
orespawn_version = 4.1.1.121012
orespawn_version_range = [4.1.1.121012,5.0.0)

# Parchment (parameter names + javadocs on top of Mojang mappings)
# Versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version = 1.21.1
parchment_mappings_version = 2024.11.17

# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.configuration-cache = false
org.gradle.caching = true
org.gradle.parallel = false
